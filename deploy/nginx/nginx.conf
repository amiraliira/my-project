# Updated for the supplied HTTP site; apply and validate this file yourself.
# Backend: 127.0.0.1:5187; public origin: http://192.168.12.92.
# Backend .env: PAK_ALLOW_INSECURE_HTTP=true, PAK_DEVELOPMENT=false.
user pak;
worker_processes auto;
pid /run/nginx.pid;
events {
    worker_connections 768;
}
http {
    ##
    # MIME types (inlined — no include needed)
    ##
    types {
        text/html                             html htm shtml;
        text/css                              css;
        text/xml                              xml;
        image/gif                             gif;
        image/jpeg                            jpeg jpg;
        application/javascript                js mjs;
        application/json                      json;
        application/manifest+json             webmanifest;
        application/wasm                      wasm;
        image/png                             png;
        image/svg+xml                         svg svgz;
        image/webp                            webp;
        image/avif                            avif;
        font/woff                             woff;
        font/woff2                            woff2;
        font/ttf                              ttf;
        font/otf                              otf;
        image/x-icon                          ico;
        text/plain                            txt;
        application/pdf                       pdf;
        application/zip                       zip;
    }
    default_type application/octet-stream;
    ##
    # Basic Settings
    ##
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    ##
    # Logging
    ##
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;
    ##
    # Gzip
    ##
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
    ##
    # Vite React site
    ##
    server {
        listen 80;
        server_name 192.168.12.92 localhost;
        root /home/pak/Desktop/UI;
        index index.html;
        # FastAPI API routes: preserve /api and bypass the asset regex.
        location = /api {
            client_max_body_size 1m;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Real-IP "";
            # Preserve backend API framing policy instead of duplicating server SAMEORIGIN.
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            proxy_cache off;
            proxy_intercept_errors off;
            proxy_buffering off;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 120s;
            proxy_pass http://127.0.0.1:5187;
        }

        # Bounded XLSX uploads; other API requests stay at 1 MiB.
        location ^~ /api/parts/import/ {
            client_max_body_size 8m;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Real-IP "";
            # Preserve backend API framing policy instead of duplicating server SAMEORIGIN.
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            proxy_cache off;
            proxy_intercept_errors off;
            proxy_buffering off;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 120s;
            # No trailing URI slash: retain /api/... for the backend route contract.
            proxy_pass http://127.0.0.1:5187;
        }

        location ^~ /api/ {
            client_max_body_size 1m;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Real-IP "";
            # Preserve backend API framing policy instead of duplicating server SAMEORIGIN.
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            proxy_cache off;
            proxy_intercept_errors off;
            proxy_buffering off;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 120s;
            # No trailing URI slash: retain /api/... for the backend route contract.
            proxy_pass http://127.0.0.1:5187;
        }

        # SPA fallback for React Router
        location / {
            try_files $uri $uri/ /index.html;
        }
        # Don't cache index.html
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires 0;
        }
        # Refresh the service worker and manifest instead of caching them for a year.
        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            expires 0;
            try_files $uri =404;
        }
        location = /manifest.webmanifest {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            expires 0;
            try_files $uri =404;
        }
        # Cache hashed Vite assets
        location ~* \.(js|mjs|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|otf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
}
# Insert these locations INSIDE the existing HTTP server {} that serves the frontend.
# Keep the current frontend root, location /, listen/TLS and server_name settings.
# PAK_PUBLIC_URL must match that public origin. Uvicorn listens on 127.0.0.1:5187.
# This is a single local Nginx hop: Uvicorn must use --no-proxy-headers.

location = /api {
    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Real-IP "";
    # Preserve backend API framing policy instead of duplicating server SAMEORIGIN.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    proxy_cache off;
    proxy_intercept_errors off;
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 120s;
    proxy_pass http://127.0.0.1:5187;
}

# Bounded XLSX uploads; other API requests stay at 1 MiB.
location ^~ /api/parts/import/ {
    client_max_body_size 8m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Real-IP "";
    # Preserve backend API framing policy instead of duplicating server SAMEORIGIN.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    proxy_cache off;
    proxy_intercept_errors off;
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 120s;
    # No trailing URI slash: retain /api/... for the backend route contract.
    proxy_pass http://127.0.0.1:5187;
}

